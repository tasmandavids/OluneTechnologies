name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Missing translation keys fall back to English silently — a locale can
      # drift for months without anyone noticing. This asserts key parity,
      # valid ICU, matching ICU arguments, Russian few/many plural categories,
      # and that critical namespaces (common, nav, auth, …) aren't still
      # holding copy-pasted English.
      - name: i18n check
        run: npm run check:i18n

      # A build failure currently reaches Vercel unblocked — typecheck and lint
      # don't catch bad metadataBase URLs, invalid next.config values, or
      # server/client boundary violations that only surface at build time.
      # (We ate a total outage from exactly that in June: commit 753f040.)
      #
      # Real secrets are used when configured; otherwise well-formed stubs let
      # the build run on forks and before secrets are set. The stubs must be
      # valid absolute URLs — next.config.ts parses the Supabase URL for the
      # next/image allowlist and APP_URL becomes the metadataBase.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://stub.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'stub-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://olune.app' }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN || 'olune.app' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_stub' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'stub-service-role-key' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_stub' }}
        run: npm run build

      # Fails the build on a known-vulnerable *production* dependency. Dev-only
      # advisories (eslint toolchain and friends) are deliberately excluded —
      # they never ship to a user.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Every merge to main: apply pending migrations.
  #
  # This job no longer seeds a platform operator. It used to run
  # scripts/seed-platform-admin.mjs against the linked production project on
  # every merge, recreating a cross-tenant superuser with a password published
  # in the repo and resetting it on each run. The job name is kept so existing
  # branch-protection rules keep matching.
  migrate-and-seed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Missing GitHub secrets. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD — see docs/SETUP_DATABASE.md"
            exit 1
          fi
          supabase link \
            --project-ref "${SUPABASE_PROJECT_REF:-wnoxcwihrzbxvogvmhqv}" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Verify migration parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/verify-migrations.mjs
