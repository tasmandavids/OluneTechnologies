# Manual re-run of the production migration push (same steps as CI → migrate-and-seed).
# On every push to main, CI already runs migrate-and-seed after tests pass.
#
# Seeding a platform operator is deliberately not part of this workflow — see
# the header of scripts/seed-platform-admin.mjs.

name: Supabase Database Sync

on:
  workflow_dispatch:

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Missing GitHub secrets. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD — see docs/SETUP_DATABASE.md"
            exit 1
          fi
          supabase link \
            --project-ref "${SUPABASE_PROJECT_REF:-wnoxcwihrzbxvogvmhqv}" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked
