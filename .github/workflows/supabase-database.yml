# Manual re-run of the production migration push (same steps as CI → migrate-and-seed).
# On every push to main, CI already runs migrate-and-seed after tests pass.
#
# Seeding a platform operator is deliberately not part of this workflow — see
# the header of scripts/seed-platform-admin.mjs.

name: Supabase Database Sync

on:
  workflow_dispatch:

jobs:
  migrate-and-seed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.107.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Missing GitHub secrets. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD — see docs/SETUP_DATABASE.md"
            exit 1
          fi
          supabase link \
            --project-ref "${SUPABASE_PROJECT_REF:-wnoxcwihrzbxvogvmhqv}" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked
